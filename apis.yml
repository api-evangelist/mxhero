aid: mxhero
name: mxHero
description: >-
  mxHERO Inc. is the pioneer of email-to-cloud content management, based in San
  Francisco and a long-time Box partner. Its Mail2Cloud platform is a bridge that
  intelligently captures email and attachments (in-flight or at-rest) over SMTP/S
  and IMAP/S and routes them, bi-directionally, into cloud content platforms such
  as Box, Egnyte, Microsoft OneDrive, Google Drive, and Dropbox — without
  retaining the content itself. Mail2Cloud Advanced adds an AI email-knowledge
  layer: captured email is deduplicated, metadata-preserved, and stored in an
  isolated per-tenant vector database that an official Model Context Protocol
  (MCP) server exposes to AI agents for secure email search and knowledge
  recovery, with a V3 REST API for dataset and S/MIME management.
